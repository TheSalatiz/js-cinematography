<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page moved | Juan Sebastian</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/js-cinematography/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&family=Hanken+Grotesk:wght@400..700&display=swap">
  <style>
  :root { --porcelain: #EEF1EE; --pine: #12241E; --ink: #33433D; --emerald: #0B6E52; --emerald-dark: #085641; color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--porcelain); color: var(--ink); }
  body { font: 18px/1.55 "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  main { max-width: 32rem; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 400; font-variation-settings: "opsz" 144, "SOFT" 30; color: var(--pine); font-size: clamp(2.2rem, 1.6rem + 3vw, 3.4rem); line-height: 1.05; margin: 0 0 16px; }
  p { margin: 0 0 24px; }
  a.btn { display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; border-radius: 999px; background: var(--emerald); color: #fff; font-weight: 600; text-decoration: none; }
  a.btn:hover { background: var(--emerald-dark); }
  a:focus-visible { outline: 3px solid var(--emerald); outline-offset: 3px; }
  </style>
</head>
<body>
<main>
  <h1>This page moved.</h1>
  <p>The site is one page now: short videos for independent med spas in Las Vegas.</p>
  <a class="btn" href="/js-cinematography/">Go to the homepage</a>
</main>
</body>
</html>
